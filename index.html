<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simmlings måltavle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap');

:root{
  --ink:#1B1029; --panel:#271A38; --panel2:#33234A; --line:#453058; --spor:#140B20;
  --paper:#F4EDE6; --muted:#A996BD; --hot:#FF3D6E; --gold:#FFC24B; --gronn:#5FD68B;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--ink);}
body{
  color:var(--paper); min-height:100vh;
  font-family:'Archivo',system-ui,sans-serif; font-variant-numeric:tabular-nums;
  padding:24px max(20px, calc(50% - 410px)) 48px;
}
h1,h2,h3,h4{font-family:'Archivo Black',system-ui,sans-serif; font-weight:400; margin:0; letter-spacing:-0.01em;}
p{margin:0;}
.muted{color:var(--muted);} .liten{font-size:13px;}
.skjult{display:none !important;}

.topp{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:18px; border-bottom:2px solid var(--line);}
.merke{font-size:30px; line-height:1;}
.undertekst{margin:6px 0 0; font-size:14px; color:var(--muted);}
.statusrad{display:flex; align-items:center; gap:8px;}
.prikk{width:9px; height:9px; border-radius:50%; background:var(--gronn); animation:puls 2.4s infinite;}
.prikk-av{background:var(--muted); animation:none;}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(95,214,139,.5);}70%{box-shadow:0 0 0 7px rgba(95,214,139,0);}100%{box-shadow:0 0 0 0 rgba(95,214,139,0);}}

.hero{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:22px; margin:20px 0 14px; transition:border-color .8s;}
.hero.blink{border-color:var(--hot); transition:none;}
.hero-merkelapp{margin:0 0 4px; font-size:13px; color:var(--gold); font-weight:600;}
.hero-rad{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.hero-tall-stor{font-size:46px; line-height:1;}
.subteller{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2;}
.subteller strong{font-family:'Archivo Black',sans-serif; font-size:22px;}
.hero-rest{margin:14px 0 0; font-size:15px; color:var(--hot); font-weight:600;}

.spor{position:relative; height:20px; background:var(--spor); border-radius:99px; overflow:hidden;}
.fyll{height:100%; background:var(--hot); border-radius:99px; transition:width .7s cubic-bezier(.2,.8,.2,1);}
.fyll-klar{background:var(--gold);} .fyll-gjort{background:var(--gronn); opacity:.5;}
.hakk{position:absolute; top:0; width:2px; height:100%; background:var(--ink);}
.hakk-nadd{background:var(--gold);}
.stige-tekst{display:flex; justify-content:space-between; margin-top:7px; gap:12px;}

.sistkort{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 16px; margin-bottom:14px;}
.sistnavn{font-family:'Archivo Black',sans-serif; font-size:16px;}
.sistbelop{color:var(--gold); font-weight:600; font-size:15px;}
.raikort{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--panel); border:1px dashed var(--line); border-radius:11px; padding:14px 16px; margin-bottom:18px;}
.raikort h4{font-size:16px;}
.raitall{display:flex; gap:14px; align-items:center; font-size:13px; color:var(--muted);}
.raitall strong{font-family:'Archivo Black',sans-serif; color:var(--paper); font-size:16px; margin-right:3px;}

.sorterad{display:flex; align-items:center; gap:10px; margin:0 0 12px; flex-wrap:wrap;}
.rundeboks{display:flex; flex-direction:column; align-items:flex-end; gap:3px; text-align:right;}
.rundenavn{font-family:'Archivo Black',sans-serif; font-size:17px; text-transform:capitalize;}
.nedtelling{font-size:13px; color:var(--gold); font-weight:600;}
.rad-planlagt{border-style:dashed; opacity:.75;}
.forklaring{margin:0 0 14px; font-size:13px; color:var(--muted); border-left:2px solid var(--gold); padding-left:12px;}
.liste{display:flex; flex-direction:column; gap:10px;}

.rad{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px 16px;}
.radtopp{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
.rad h4{font-size:17px;}
.radsum{font-family:'Archivo Black',sans-serif; font-size:15px; color:var(--muted); white-space:nowrap;}
.rad .tall{margin:5px 0 10px; font-size:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;}
.rad-klar{border-color:var(--gold);}
.rad-gjort{opacity:.6;} .rad-gjort h4{text-decoration:line-through; text-decoration-thickness:2px;}
.bar{height:8px; background:var(--spor); border-radius:99px; overflow:hidden;}

.merke-gul{color:var(--ink); background:var(--gold); border-radius:99px; padding:1px 9px; font-size:12px; font-weight:600;}
.merke-nar{color:var(--paper); border:1px solid var(--gold); border-radius:99px; padding:1px 9px; font-size:12px;}
.merke-gronn{color:var(--ink); background:var(--gronn); border-radius:99px; padding:1px 9px; font-size:12px; font-weight:600;}

.kasse{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:18px; margin:18px 0;}
.kasse-topp{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;}
.kasse-topp div{display:flex; flex-direction:column;}
.kasse-sum{font-family:'Archivo Black',sans-serif; font-size:30px; line-height:1.1;}

.verktoy{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.verktoy-ren{border-top:none; padding-top:0; margin-top:4px;}
.mini{background:var(--panel2); color:var(--paper); border:1px solid var(--line); border-radius:7px; padding:5px 10px; font-size:13px; font-family:inherit; cursor:pointer;}
.mini:hover{background:#3F2C58;}
.mini:disabled{opacity:.4; cursor:default;}
.mini-ok{background:var(--gronn); color:var(--ink); border-color:var(--gronn); font-weight:600;}
.mini-fare{color:var(--hot); border-color:#5A2338;}

.felt{background:var(--spor); color:var(--paper); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:14px; font-family:inherit;}
.felt-mini{width:82px; padding:5px 8px; font-size:13px;}
.felt-kort{width:130px;}

.login{max-width:420px; margin:60px auto; background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:26px;}
.login h2{font-size:28px;} .login p{margin:8px 0 16px;}
.login .felt{width:100%; margin-bottom:8px;}

.seksjon{margin:26px 0;}
.seksjon h3{font-size:17px; margin-bottom:12px;}
.huk{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted);}
.skjema{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px;}

.bunn{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border-top:2px solid var(--line); padding-top:14px; margin-top:18px;}
.rad-knapper{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.knapp{background:var(--hot); color:#fff; border:none; border-radius:7px; padding:7px 14px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;}
.knapp-svak{background:var(--panel2); border:1px solid var(--line); color:var(--paper); font-weight:500;}
.feil{color:var(--hot); font-size:13px; margin-top:8px;}

button:focus-visible,input:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

@media (max-width:520px){
  body{padding:18px 14px 36px;}
  .merke{font-size:24px;} .hero-tall-stor{font-size:36px;} .kasse-sum{font-size:25px;}
  .topp{align-items:flex-start; flex-direction:column;}
  .felt-kort{width:100%;}
}
@media (prefers-reduced-motion:reduce){ .fyll{transition:none;} .prikk{animation:none;} }

/* Overlay for OBS */
body.overlay{background:transparent; padding:0; min-height:0; width:520px;}
body.overlay .boks{
  background:rgba(27,16,41,.92); border:2px solid var(--gold); border-radius:14px;
  padding:16px 18px; width:520px;
}
body.overlay .boks.ikke-nadd{border-color:var(--line);}
body.overlay .o-topp{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:2px;}
body.overlay .o-merke{font-size:12px; color:var(--gold); font-weight:600;}
body.overlay .o-subs{font-size:12px; color:var(--muted); white-space:nowrap;}
body.overlay .o-tittel{font-size:22px; line-height:1.15; margin-bottom:12px;}
body.overlay .o-bunn{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:9px; font-size:15px; font-weight:600;}
body.overlay .o-rest{color:var(--hot);}
body.overlay .spor{height:16px;}
</style>
</head>
<body>

<div id="oppsett" class="skjult">
  <div class="login">
    <h2>Mangler oppsett</h2>
    <p class="muted">Fyll inn Firebase-nøklene øverst i index.html, så starter tavla.</p>
  </div>
</div>

<div id="app"></div>

<script type="module">
// ---------------------------------------------------------------
// Firebase-oppsett for simmlings-donogoals
// ---------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyCaPt7shoOUyYAQJVdBODj--_kbTgSgU7M",
  authDomain: "simmlings-donogoals.firebaseapp.com",
  databaseURL: "https://simmlings-donogoals-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "simmlings-donogoals",
  storageBucket: "simmlings-donogoals.firebasestorage.app",
  messagingSenderId: "454308280678",
  appId: "1:454308280678:web:a39bb3ae1f844f9f18f0a7"
};
// ---------------------------------------------------------------

const STARTMAL = [
  { id: "gta5", title: "GTA 5 story mode maraton", sum: 1000, done: false },
  { id: "bk", title: "Bare Burger King en hel dag", sum: 2000, done: false },
  { id: "natt", title: "Nattbading", sum: 3000, done: false },
  { id: "kcal", title: "10 000 kalorier på en dag", sum: 4000, done: false },
  { id: "ps5", title: "PlayStation 5", sum: 5000, done: false }
];

if (!firebaseConfig.apiKey) {
  document.getElementById("oppsett").classList.remove("skjult");
} else {
  start();
}

async function start() {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, onValue, set, update, runTransaction } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    setPersistence, browserLocalPersistence, browserSessionPersistence } =
    await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const tavleRef = ref(db, "tavle");

  let data = null, bruker = null, view = "tavle", retning = "lav", tilkoblet = false, bekreft = null;
  let valgtManed = null;
  let forrigeTotal = null, blinker = false;

  const kr = n => new Intl.NumberFormat("nb-NO").format(Math.round(n)) + " kr";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const naaManed = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
  const nesteManed = n => { const [y, m] = (n || naaManed()).split("-").map(Number); const d = new Date(y, m, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
  const manedNavn = n => { const [y, m] = n.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("nb-NO", { month: "long", year: "numeric" }); };
  const TOT = m => Number(((data && data.totaler) || {})[m || naaManed()] || 0);
  const SUBS = m => Number(((data && data.subsTotaler) || {})[m || naaManed()] || 0);
  const malFor = m => Object.values((data && data.goals) || {}).filter(g => (g.maned || naaManed()) === m).sort((a, b) => a.sum - b.sum);
  const mal = () => malFor(naaManed());
  function tidIgjen() {
    const n = new Date();
    const slutt = new Date(n.getFullYear(), n.getMonth() + 1, 1, 0, 0, 0);
    let s = Math.max(0, Math.floor((slutt - n) / 1000));
    const dager = Math.floor(s / 86400); s -= dager * 86400;
    const timer = Math.floor(s / 3600); s -= timer * 3600;
    const min = Math.floor(s / 60);
    return {
      kort: dager > 0 ? dager + "d " + timer + "t" : timer + "t " + min + "m",
      lang: dager > 1 ? dager + " dager igjen" : dager === 1 ? "1 dag og " + timer + " timer igjen"
        : timer > 0 ? timer + " timer og " + min + " min igjen" : min + " min igjen"
    };
  }
  const siden = ts => {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 10) return "nå nettopp";
    if (s < 60) return "for " + s + " sek siden";
    const m = Math.round(s / 60);
    return m < 60 ? "for " + m + " min siden" : "for " + Math.round(m / 60) + " t siden";
  };

  onValue(tavleRef, snap => {
    tilkoblet = true;
    const v = snap.val();
    if (!v) {
      data = { total: 0, goals: {}, rai: { title: "Rai rai med energidrikk", unit: 25, drikke: "energidrikk", av: false, kjopt: 0, tatt: 0 }, logg: [], updatedAt: Date.now() };
      STARTMAL.forEach(g => (data.goals[g.id] = g));
      if (bruker) set(tavleRef, data);
    } else {
      const nyTotal = Number(((v.totaler) || {})[naaManed()] || 0);
      if (forrigeTotal !== null && forrigeTotal !== nyTotal) {
        blinker = true;
        setTimeout(() => { blinker = false; tegn(); }, 1200);
      }
      forrigeTotal = nyTotal;
      data = v;
      if (!data.goals) data.goals = {};
      if (!data.rai) data.rai = { title: "Rai rai med energidrikk", unit: 25, drikke: "energidrikk", av: false, kjopt: 0, tatt: 0 };
      if (bruker && !data.totaler) migrer();
    }
    tegn();
  }, () => { tilkoblet = false; tegn(); });

  onAuthStateChanged(auth, u => {
    bruker = u;
    if (!u && view === "admin") view = "tavle";
    if (u && view === "login") view = "admin";
    tegn();
  });

  setInterval(() => { if (data) tegn(); }, 20000);

  // ---- skriveoperasjoner ----
  const stempel = () => update(tavleRef, { updatedAt: Date.now() });

  function leggTil(belop, merke, antall, navn) {
    const b = Number(belop);
    const n = Number(antall) || 1;
    if (!b) return;
    runTransaction(tavleRef, cur => {
      if (!cur) return cur;
      const m = naaManed();
      cur.totaler = cur.totaler || {};
      cur.totaler[m] = Math.max(0, Number(cur.totaler[m] || 0) + b);
      cur.logg = [{ t: Date.now(), b, merke: merke || null, n }, ...(cur.logg || [])].slice(0, 12);
      if (navn) cur.sist = { navn: String(navn).slice(0, 40), belop: b, t: Date.now(), av: cur.sist ? !!cur.sist.av : false };
      if (merke === "sub") { cur.subsTotaler = cur.subsTotaler || {}; cur.subsTotaler[m] = Number(cur.subsTotaler[m] || 0) + n; }
      if (merke === "rai") cur.rai.kjopt = (cur.rai.kjopt || 0) + 1;
      cur.updatedAt = Date.now();
      return cur;
    });
  }
  function settTotal(verdi) {
    const v = Math.max(0, Math.round(Number(verdi) || 0));
    runTransaction(tavleRef, cur => {
      if (!cur) return cur;
      cur.totaler = cur.totaler || {};
      cur.totaler[naaManed()] = v;
      cur.logg = [{ t: Date.now(), b: 0, merke: "rettet", n: v }, ...(cur.logg || [])].slice(0, 12);
      cur.updatedAt = Date.now();
      return cur;
    });
  }

  function angre() {
    runTransaction(tavleRef, cur => {
      if (!cur || !cur.logg || !cur.logg.length) return cur;
      const [siste, ...rest] = cur.logg;
      const m = naaManed();
      cur.totaler = cur.totaler || {};
      cur.totaler[m] = Math.max(0, Number(cur.totaler[m] || 0) - siste.b);
      if (siste.merke === "sub") { cur.subsTotaler = cur.subsTotaler || {}; cur.subsTotaler[m] = Math.max(0, Number(cur.subsTotaler[m] || 0) - (siste.n || 1)); }
      if (siste.merke === "rai") cur.rai.kjopt = Math.max(0, cur.rai.kjopt - 1);
      cur.logg = rest;
      cur.updatedAt = Date.now();
      return cur;
    });
  }
  const settMal = (id, patch) => { update(ref(db, "tavle/goals/" + id), patch); stempel(); };
  const slettMal = id => { set(ref(db, "tavle/goals/" + id), null); stempel(); };
  const settRai = patch => { update(ref(db, "tavle/rai"), patch); stempel(); };
  const settSist = patch => { update(ref(db, "tavle/sist"), patch); stempel(); };
  function nyttMal(title, sum, maned) {
    const id = "m" + Date.now();
    set(ref(db, "tavle/goals/" + id), { id, title, sum: Math.max(1, Number(sum) || 1000), done: false, maned: maned || naaManed() });
    stempel();
  }

  function migrer() {
    const m = naaManed();
    const goals = {};
    Object.values(data.goals || {}).forEach(g => (goals[g.id] = { ...g, maned: g.maned || m }));
    set(tavleRef, {
      ...data, goals,
      totaler: { [m]: Number(data.total || 0) },
      subsTotaler: { [m]: Number(data.subs || 0) },
      total: null, subs: null, updatedAt: Date.now()
    });
  }
  function nullstill() {
    const m = naaManed();
    const goals = { ...(data.goals || {}) };
    mal().forEach(g => (goals[g.id] = { ...g, done: false }));
    set(tavleRef, {
      ...data, goals, logg: [],
      totaler: { ...(data.totaler || {}), [m]: 0 },
      subsTotaler: { ...(data.subsTotaler || {}), [m]: 0 },
      rai: { ...data.rai, kjopt: 0, tatt: 0 }, updatedAt: Date.now()
    });
  }

  // ---- visning ----
  const app_ = document.getElementById("app");

  const params = new URLSearchParams(location.search);
  const erOverlay = params.has("overlay");
  if (erOverlay) {
    document.body.classList.add("overlay");
    document.documentElement.style.background = "transparent";
  }

  function overlayHtml() {
    const liste = mal();
    const neste = liste.find(g => TOT() < g.sum);
    const laast = liste.filter(g => TOT() >= g.sum && !g.done);
    const vis = neste || laast[0] || liste[liste.length - 1];
    if (!vis) return "";
    const nadd = TOT() >= vis.sum;
    return `<div class="boks ${nadd ? "" : "ikke-nadd"}">
      <div class="o-topp">
        <p class="o-merke">${nadd ? "Låst opp, venter på gjennomføring" : "Neste mål"}</p>
        <p class="o-subs">${SUBS() || 0} subs · ${tidIgjen().kort} igjen</p>
      </div>
      <h2 class="o-tittel">${esc(vis.title)}</h2>
      <div class="spor"><div class="fyll ${nadd ? "fyll-klar" : ""}"
        style="width:${Math.min(100, (TOT() / vis.sum) * 100)}%"></div></div>
      <div class="o-bunn">
        <span>${kr(TOT())} <span class="muted">av ${kr(vis.sum)}</span></span>
        ${nadd ? "" : `<span class="o-rest">${kr(vis.sum - TOT())} igjen</span>`}
      </div>
    </div>`;
  }

  function tegn() {
    if (!data) { app_.innerHTML = erOverlay ? "" : '<p class="muted" style="padding:40px">Kobler til</p>'; return; }
    if (erOverlay) { app_.innerHTML = overlayHtml(); return; }
    if (view === "login") app_.innerHTML = loginHtml();
    else if (view === "admin" && bruker) app_.innerHTML = adminHtml();
    else app_.innerHTML = tavleHtml();
    koble();
  }

  function loginHtml() {
    return `<div class="login">
      <h2>Adminside</h2>
      <p class="muted">Logg inn for å oppdatere tavla. Seerne trenger ikke konto.</p>
      <input class="felt" id="epost" type="email" placeholder="E-post" autocomplete="username">
      <input class="felt" id="passord" type="password" placeholder="Passord" autocomplete="current-password">
      <label class="huk" style="margin:4px 0 14px"><input type="checkbox" id="husk" checked> Husk meg på denne enheten</label>
      <div class="rad-knapper">
        <button class="knapp" id="loggInn">Logg inn</button>
        <button class="knapp knapp-svak" data-view="tavle">Tilbake</button>
      </div>
      <p class="feil skjult" id="loginFeil">Feil e-post eller passord.</p>
    </div>`;
  }

  function stige() {
    const liste = mal();
    if (!liste.length) return "";
    const topp = liste[liste.length - 1];
    const andel = Math.min(100, (TOT() / topp.sum) * 100);
    const hakk = liste.slice(0, -1).map(g =>
      `<span class="hakk ${TOT() >= g.sum ? "hakk-nadd" : ""}" style="left:${(g.sum / topp.sum) * 100}%"></span>`).join("");
    return `<div class="spor"><div class="fyll" style="width:${andel}%"></div>${hakk}</div>
      <div class="stige-tekst"><span class="muted liten">0 kr</span>
      <span class="muted liten">${esc(topp.title)} på ${kr(topp.sum)}</span></div>`;
  }

  function tavleHtml() {
    const liste = mal();
    const neste = liste.find(g => TOT() < g.sum);
    const vist = retning === "lav" ? liste : [...liste].reverse();
    const kø = Math.max(0, (data.rai.kjopt || 0) - (data.rai.tatt || 0));

    return `
    <header class="topp">
      <div><h1 class="merke">simmlings</h1>
      <p class="undertekst">Nye mål hver måned. Donasjoner og subs teller mot alle målene.</p></div>
      <div class="rundeboks">
        <span class="muted liten">Månedens runde</span>
        <span class="rundenavn">${manedNavn(naaManed())}</span>
        <span class="nedtelling">${tidIgjen().lang}</span>
        <span class="statusrad"><span class="prikk ${tilkoblet ? "" : "prikk-av"}"></span>
        <span class="muted liten">${tilkoblet ? "oppdateres live" : "ingen forbindelse"}</span></span>
      </div>
    </header>

    <section class="hero ${blinker ? "blink" : ""}">
      <p class="hero-merkelapp">${neste ? "Neste opp: " + esc(neste.title) : "Alle mål er låst opp"}</p>
      <div class="hero-rad">
        <h2 class="hero-tall-stor">${kr(TOT())}</h2>
        <div class="subteller"><strong>${SUBS() || 0}</strong><span class="muted liten">subs så langt</span></div>
      </div>
      ${stige()}
      ${neste ? `<p class="hero-rest">${kr(neste.sum - TOT())} igjen til ${esc(neste.title)}</p>` : ""}
    </section>

    ${(data.sist && data.sist.navn && !data.sist.av) ? `<section class="sistkort">
      <span class="muted liten">Sist inn</span>
      <span class="sistnavn">${esc(data.sist.navn)}</span>
      <span class="sistbelop">${kr(data.sist.belop)}</span>
    </section>` : ""}

    ${data.rai.av ? "" : `<section class="raikort">
      <div><h4>${esc(data.rai.title)}</h4>
      <p class="tall muted liten">${kr(data.rai.unit)} per stk. Kommer i tillegg til stigen.</p></div>
      <div class="raitall"><span><strong>${data.rai.kjopt || 0}</strong> kjøpt</span>
      <span><strong>${data.rai.tatt || 0}</strong> tatt</span>
      ${kø > 0 ? `<span class="merke-gul">${kø} i kø</span>` : ""}</div>
    </section>`}

    <p class="forklaring">Alle mål skal gjennomføres før måneden er omme. Ved månedsskiftet nullstilles telleren og nye mål kommer opp.</p>

    <div class="sorterad"><span class="muted liten">Sortert etter sum</span>
      <button class="mini" id="snu">${retning === "lav" ? "Lavest først" : "Høyest først"}</button></div>

    <div class="liste">${vist.map(radHtml).join("")}</div>

    ${(() => {
      const nm = nesteManed();
      const planlagt = malFor(nm);
      if (!planlagt.length) return "";
      return `<section class="seksjon" style="margin-top:26px">
        <div class="seksjon-topp"><h3>Planlagt for ${manedNavn(nm)}</h3>
        <span class="teller">${planlagt.length}</span></div>
        <div class="liste">${planlagt.map(g => `<article class="rad rad-planlagt">
          <div class="radtopp"><h4>${esc(g.title)}</h4><span class="radsum">${kr(g.sum)}</span></div>
        </article>`).join("")}</div></section>`;
    })()}

    <footer class="bunn">
      <span class="muted liten">Sist oppdatert ${siden(data.updatedAt || Date.now())}</span>
      <button class="knapp knapp-svak" data-view="login">Adminside</button>
    </footer>`;
  }

  function radHtml(g) {
    const nadd = TOT() >= g.sum;
    const klasse = g.done ? "rad-gjort" : nadd ? "rad-klar" : "";
    const merke = g.done ? '<span class="merke-gronn">Gjennomført</span>'
      : nadd ? '<span class="merke-gul">Låst opp, venter på gjennomføring</span>'
      : `<span class="muted">${kr(g.sum - TOT())} igjen</span>`;
    const nar = (!g.done && g.nar) ? `<span class="merke-nar">${g.nar === "asap" ? "Så fort som mulig" : esc(g.nar)}</span>` : "";
    return `<article class="rad ${klasse}">
      <div class="radtopp"><h4>${esc(g.title)}</h4><span class="radsum">${kr(g.sum)}</span></div>
      <p class="tall">${merke}${nar}</p>
      <div class="bar"><div class="fyll ${g.done ? "fyll-gjort" : nadd ? "fyll-klar" : ""}"
        style="width:${Math.min(100, (TOT() / g.sum) * 100)}%"></div></div>
    </article>`;
  }

  function adminHtml() {
    if (!valgtManed) valgtManed = naaManed();
    const liste = mal();
    const vist = retning === "lav" ? liste : [...liste].reverse();
    const logg = (data.logg || []).slice(0, 6).map(l => (l.merke === "rettet" ? "satt til " + l.n : (l.b > 0 ? "+" : "") + l.b
      + (l.merke === "rai" ? " rai" : l.merke === "tip" ? " tips" : ""))).join(", ");
    return `
    <header class="topp">
      <div><h1 class="merke">Adminside</h1>
      <p class="undertekst">Innlogget som ${esc(bruker && bruker.email ? bruker.email : "")}</p></div>
      <div class="rad-knapper">
        <button class="knapp knapp-svak" data-view="tavle">Se tavla</button>
        <button class="knapp knapp-svak" id="loggUt">Logg ut</button>
      </div>
    </header>

    <section class="kasse">
      <div class="kasse-topp">
        <div><span class="muted liten">Samlet inn</span><strong class="kasse-sum">${kr(TOT())}</strong></div>
        <button class="mini" id="angre" ${(data.logg || []).length ? "" : "disabled"}>Angre siste</button>
      </div>
      <div class="verktoy verktoy-ren">
        ${[25, 50, 100, 250, 500, 1000].map(b => `<button class="mini" data-legg="${b}">+${b}</button>`).join("")}
        <input class="felt felt-mini" type="number" id="egetBelop" placeholder="kr">
        <button class="mini mini-ok" id="leggEget">Legg til</button>
      </div>
      <div class="verktoy">
        <span class="muted liten" style="align-self:center">Fra hvem (valgfritt)</span>
        <input class="felt felt-mini" style="width:150px" type="text" id="giverNavn" placeholder="Navn">
        <span class="muted liten" style="align-self:center">
          ${(data.sist && data.sist.navn) ? "Viser nå: " + esc(data.sist.navn) + " · " + kr(data.sist.belop) : "Ingen registrert ennå"}
        </span>
        <button class="mini" id="sistSynlig">${(data.sist && data.sist.av) ? "Vis på tavla" : "Skjul fra tavla"}</button>
      </div>
      <div class="verktoy">
        <span class="muted liten" style="align-self:center">Rett opp hele summen</span>
        <input class="felt felt-mini" type="number" id="rettTotal" value="${TOT()}">
        <button class="mini" id="settTotal">Sett total</button>
        <span class="muted liten" style="align-self:center; margin-left:10px">Antall subs</span>
        <input class="felt felt-mini" type="number" id="rettSubs" value="${SUBS() || 0}">
        <button class="mini" id="settSubs">Sett</button>
      </div>
      ${logg ? `<p class="muted liten" style="margin-top:12px">Siste: ${esc(logg)}</p>` : ""}
    </section>

    <section class="raikort" style="display:block">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap">
        <div><h4>${esc(data.rai.title)}</h4>
        <p class="tall muted liten">${data.rai.kjopt || 0} kjøpt · ${data.rai.tatt || 0} tatt · ${Math.max(0, (data.rai.kjopt || 0) - (data.rai.tatt || 0))} i kø${data.rai.av ? " · skjult for seerne" : ""}</p></div>
        <div class="rad-knapper">
          <button class="mini" id="raiKjopt">Kjøpt en</button>
          <button class="mini" id="raiKjoptAngre">Angre kjøpt</button>
          <button class="mini mini-ok" id="raiTatt">Tatt en</button>
          <button class="mini" id="raiAngre">Angre tatt</button>
          <button class="mini" id="raiSynlig">${data.rai.av ? "Vis på tavla" : "Skjul fra tavla"}</button>
          ${bekreft === "rai"
            ? `<span class="feil" style="align-self:center">Nullstiller kjøpt og tatt.</span>
               <button class="mini mini-fare" id="raiNullJa">Ja, nullstill</button>
               <button class="mini" id="raiNullNei">Avbryt</button>`
            : `<button class="mini mini-fare" id="raiNull">Nullstill teller</button>`}
        </div>
      </div>
      <div class="verktoy">
        <select class="felt felt-mini" id="raiDrikke" style="width:130px">
          <option value="energidrikk" ${data.rai.drikke === "øl" ? "" : "selected"}>Energidrikk</option>
          <option value="øl" ${data.rai.drikke === "øl" ? "selected" : ""}>Øl</option>
        </select>
        <input class="felt felt-mini" type="number" id="raiPris" value="${data.rai.unit}">
        <span class="muted liten" style="align-self:center">kr per stk</span>
        <button class="mini mini-ok" id="raiLagre">Lagre</button>
      </div>
    </section>

    <div class="sorterad" style="justify-content:space-between">
      <span class="rad-knapper">
        <button class="mini ${valgtManed === denne ? "mini-ok" : ""}" data-maned="${denne}">${manedNavn(denne)}</button>
        <button class="mini ${valgtManed === neste ? "mini-ok" : ""}" data-maned="${neste}">${manedNavn(neste)}</button>
        <span class="muted liten" style="align-self:center">${valgtManed === denne ? tidIgjen().lang : "planlegges nå"}</span>
      </span>
      <button class="mini" id="snu">${retning === "lav" ? "Lavest først" : "Høyest først"}</button>
    </div>

    <div class="liste">${vist.map(g => {
      const nadd = TOT() >= g.sum;
      return `<article class="rad ${g.done ? "rad-gjort" : nadd ? "rad-klar" : ""}">
        <div class="radtopp"><h4>${esc(g.title)}</h4><span class="radsum">${kr(g.sum)}</span></div>
        <p class="tall">${g.done ? '<span class="merke-gronn">Gjennomført</span>'
          : nadd ? '<span class="merke-gul">Låst opp</span>'
          : `<span class="muted">${kr(g.sum - TOT())} igjen</span>`}
          ${g.nar ? `<span class="merke-nar">${g.nar === "asap" ? "Så fort som mulig" : esc(g.nar)}</span>` : ""}</p>
        <div class="verktoy">
          <button class="mini mini-ok" data-gjort="${g.id}">${g.done ? "Åpne igjen" : "Marker gjort"}</button>
          <input class="felt" style="flex:1; min-width:180px" type="text" value="${esc(g.title)}" data-tittelfelt="${g.id}">
          <input class="felt felt-mini" type="number" value="${g.sum}" data-sumfelt="${g.id}">
          <input class="felt felt-mini" style="width:150px" type="text" placeholder="Når, valgfritt"
            value="${g.nar === "asap" ? "" : esc(g.nar || "")}" data-narfelt="${g.id}">
          <button class="mini" data-lagre="${g.id}">Lagre</button>
          <button class="mini" data-asap="${g.id}">${g.nar === "asap" ? "Fjern ASAP" : "ASAP"}</button>
          <button class="mini" data-flytt="${g.id}">${(g.maned || denne) === denne ? "Flytt til " + manedNavn(neste) : "Flytt til " + manedNavn(denne)}</button>
          <button class="mini mini-fare" data-slett="${g.id}">Slett</button>
        </div></article>`;
    }).join("")}</div>

    <section class="seksjon">
      <h3>Nytt mål</h3>
      <div class="skjema">
        <input class="felt" id="nyTittel" placeholder="Hva skal han gjøre?">
        <input class="felt felt-kort" id="nySum" type="number" placeholder="Sum i kr">
        <button class="knapp" id="leggMal">Legg til mål</button>
      </div>
    </section>

    <footer class="bunn">
      <span class="muted liten">Sist lagret ${siden(data.updatedAt || Date.now())}</span>
      <button class="mini mini-fare" id="nullstill">Nullstill alt</button>
    </footer>`;
  }

  // ---- hendelser ----
  function koble() {
    document.querySelectorAll("[data-view]").forEach(b =>
      b.onclick = () => {
        view = (b.dataset.view === "login" && bruker) ? "admin" : b.dataset.view;
        tegn();
      });

    const snu = document.getElementById("snu");
    if (snu) snu.onclick = () => { retning = retning === "lav" ? "hoy" : "lav"; tegn(); };

    const inn = document.getElementById("loggInn");
    if (inn) {
      const gjor = async () => {
        try {
          const husk = document.getElementById("husk").checked;
          await setPersistence(auth, husk ? browserLocalPersistence : browserSessionPersistence);
          await signInWithEmailAndPassword(auth,
            document.getElementById("epost").value.trim(),
            document.getElementById("passord").value);
          view = "admin"; tegn();
        } catch (e) {
          document.getElementById("loginFeil").classList.remove("skjult");
        }
      };
      inn.onclick = gjor;
      document.getElementById("passord").onkeydown = e => { if (e.key === "Enter") gjor(); };
    }

    const ut = document.getElementById("loggUt");
    if (ut) ut.onclick = () => { signOut(auth); view = "tavle"; tegn(); };

    document.querySelectorAll("[data-legg]").forEach(b => b.onclick = () => leggTil(b.dataset.legg));

    const eget = document.getElementById("leggEget");
    if (eget) {
      const felt = document.getElementById("egetBelop");
      const send = () => {
        if (felt.value === "") return;
        const nf = document.getElementById("giverNavn");
        const navn = nf && nf.value.trim() ? nf.value.trim() : null;
        leggTil(felt.value, null, 1, navn);
        felt.value = "";
        if (nf) nf.value = "";
      };
      eget.onclick = send;
      felt.onkeydown = e => { if (e.key === "Enter") send(); };
    }

    const a = document.getElementById("angre"); if (a) a.onclick = angre;
    const rk = document.getElementById("raiKjopt");
    if (rk) rk.onclick = () => settRai({ kjopt: (data.rai.kjopt || 0) + 1 });
    const rka = document.getElementById("raiKjoptAngre");
    if (rka) rka.onclick = () => settRai({ kjopt: Math.max(0, (data.rai.kjopt || 0) - 1) });

    const rt = document.getElementById("raiTatt"); if (rt) rt.onclick = () => settRai({ tatt: (data.rai.tatt || 0) + 1 });
    const ra = document.getElementById("raiAngre"); if (ra) ra.onclick = () => settRai({ tatt: Math.max(0, (data.rai.tatt || 0) - 1) });
    const rn = document.getElementById("raiNull");
    if (rn) rn.onclick = () => { bekreft = "rai"; tegn(); };
    const rnj = document.getElementById("raiNullJa");
    if (rnj) rnj.onclick = () => { bekreft = null; settRai({ kjopt: 0, tatt: 0 }); };
    const rnn = document.getElementById("raiNullNei");
    if (rnn) rnn.onclick = () => { bekreft = null; tegn(); };

    const rs = document.getElementById("raiSynlig"); if (rs) rs.onclick = () => settRai({ av: !data.rai.av });
    const rl = document.getElementById("raiLagre");
    if (rl) rl.onclick = () => {
      const drikke = document.getElementById("raiDrikke").value;
      const pris = Math.max(1, Number(document.getElementById("raiPris").value) || data.rai.unit);
      settRai({ drikke, unit: pris, title: "Rai rai med " + drikke });
    };

    document.querySelectorAll("[data-gjort]").forEach(b =>
      b.onclick = () => settMal(b.dataset.gjort, { done: !data.goals[b.dataset.gjort].done }));
    document.querySelectorAll("[data-lagre]").forEach(b =>
      b.onclick = () => {
        const id = b.dataset.lagre;
        const sumFelt = document.querySelector('[data-sumfelt="' + id + '"]');
        const tittelFelt = document.querySelector('[data-tittelfelt="' + id + '"]');
        const tittel = tittelFelt.value.trim();
        const narFelt = document.querySelector('[data-narfelt="' + id + '"]');
        settMal(id, {
          sum: Math.max(1, Number(sumFelt.value) || 1),
          title: tittel || data.goals[id].title,
          nar: narFelt.value.trim() || null
        });
      });

    document.querySelectorAll("[data-asap]").forEach(b =>
      b.onclick = () => {
        const id = b.dataset.asap;
        settMal(id, { nar: data.goals[id].nar === "asap" ? null : "asap" });
      });

    document.querySelectorAll("[data-maned]").forEach(b =>
      b.onclick = () => { valgtManed = b.dataset.maned; tegn(); });

    document.querySelectorAll("[data-flytt]").forEach(b =>
      b.onclick = () => {
        const id = b.dataset.flytt;
        const denne = naaManed();
        const na = data.goals[id].maned || denne;
        settMal(id, { maned: na === denne ? nesteManed() : denne });
      });

    const ss = document.getElementById("sistSynlig");
    if (ss) ss.onclick = () => settSist({ av: !(data.sist && data.sist.av) });

    const st = document.getElementById("settTotal");
    if (st) st.onclick = () => settTotal(document.getElementById("rettTotal").value);

    const sb = document.getElementById("settSubs");
    if (sb) sb.onclick = () => {
      const v = Math.max(0, Math.round(Number(document.getElementById("rettSubs").value) || 0));
      update(tavleRef, { ["subsTotaler/" + naaManed()]: v, updatedAt: Date.now() });
    };
    document.querySelectorAll("[data-slett]").forEach(b =>
      b.onclick = () => { if (confirm("Slette dette målet?")) slettMal(b.dataset.slett); });

    const nm = document.getElementById("leggMal");
    if (nm) nm.onclick = () => {
      const t = document.getElementById("nyTittel").value.trim();
      if (t) nyttMal(t, document.getElementById("nySum").value, valgtManed || naaManed());
    };

    const nl = document.getElementById("nullstill");
    if (nl) nl.onclick = () => { if (confirm("Nullstille sum og status?")) nullstill(); };
  }
}
</script>
</body>
</html>
